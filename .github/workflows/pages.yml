name: Deploy static site to GitHub Pages
on:
  push:
    branches: [ main ]    # change if your default branch is different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site directory from public/
        run: |
          mkdir -p site
          # Copy everything from public/ into site. Adjust if your files are elsewhere.
          cp -r public/* site/ || true
          # Ensure index.html exists
          if [ ! -f site/index.html ]; then
            echo "ERROR: site/index.html not found"
            ls -la site || true
            exit 1
          fi
          # Prevent GitHub from running Jekyll (important for plain static files)
          touch site/.nojekyll
          echo "Site prepared. Files:"
          ls -la site

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: site

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1